<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Consola{% endblock %} · Agentic Marketing Suite</title>
<style>
:root{--paper:#F6F8F7;--ink:#1B2421;--ink2:#4A5751;--line:#D8E0DC;--card:#fff;
  --accent:#0E6B5C;--gate:#1ebe82;--warn:#B4590A;--bad:#A63A2E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
nav{display:flex;gap:1.2rem;align-items:center;padding:.8rem 1.4rem;
  background:var(--card);border-bottom:1px solid var(--line)}
nav .marca{font-weight:700;color:var(--accent)}
nav a{color:var(--ink2);text-decoration:none}
nav a:hover{color:var(--ink)}
nav .der{margin-left:auto;font-size:.85rem;color:var(--ink2)}
main{max-width:60rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
h1{font-size:1.5rem;margin:.5rem 0 1rem}
h2{font-size:1.1rem;margin:1.6rem 0 .6rem}
table{border-collapse:collapse;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.93rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);
  text-align:left;padding:.55rem .8rem;border-bottom:1px solid var(--line)}
td{padding:.5rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
a{color:var(--accent)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:.1em .6em;
  border-radius:99px;background:#EDF2F0;color:var(--ink2)}
.chip.pausa{background:#FBF3E8;color:var(--warn)}
.chip.ok{background:#EAF4EE;color:#176A4A}
.btn{display:inline-block;border:0;border-radius:6px;padding:.5em 1.1em;
  font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn-aprobar{background:var(--gate);color:#fff}    /* verde reservado a compuertas humanas */
.btn-devolver{background:#EDF2F0;color:var(--warn)}
.btn-bloquear{background:#EDF2F0;color:var(--bad)}
.btn-sec{background:var(--accent);color:#fff}
pre{background:#0F1613;color:#D8E6DF;padding:1rem;border-radius:8px;
  overflow-x:auto;font-size:.82rem;line-height:1.45}
.msgs{list-style:none;padding:0;margin:0 0 1rem}
.msgs li{padding:.55rem .9rem;border-radius:6px;margin:.3rem 0;background:#EAF4EE;
  border:1px solid var(--line)}
.msgs li.error{background:#FAEFEC}
form.inline{display:inline}
input[type=text],textarea{width:100%;padding:.5em;border:1px solid var(--line);
  border-radius:6px;font:inherit;background:var(--card)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;min-height:22rem}
label{font-weight:600;font-size:.9rem;display:block;margin:.9rem 0 .25rem}
.nota{color:var(--ink2);font-size:.86rem}
</style>
</head>
<body>
<nav>
  <span class="marca">Agentic Marketing Suite</span>
  <a href="{% url 'panel' %}">Tablero</a>
  <a href="{% url 'nueva' %}">Nueva corrida</a>
  <span class="der">
    {% if user.is_authenticated %}
      {{ user.get_username }} ·
      <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button class="btn" style="background:none;color:var(--ink2);padding:0">Salir</button>
      </form>
    {% endif %}
  </span>
</nav>
<main>
{% if messages %}<ul class="msgs">{% for m in messages %}
  <li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
