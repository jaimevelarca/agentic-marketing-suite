# Build + push the suite orchestrator image (Cloud Run Job).
# Run from repo root:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suite/orchestrator:${_TAG}",
           "."]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/suite/orchestrator:${_TAG}"
substitutions:
  _REGION: us-central1
  _TAG: dev
options:
  logging: CLOUD_LOGGING_ONLY
