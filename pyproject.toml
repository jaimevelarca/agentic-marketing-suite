[project]
name = "agentic-marketing-suite"
version = "0.2.0"
description = "Agentic Marketing Suite — QHHE's 6-layer / 19-agent marketing engine"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "anthropic[vertex]>=0.96",
    "google-cloud-firestore>=2.27",
    "google-cloud-pubsub>=2.23",
    "pydantic>=2.8",
    "jsonschema>=4.23",
    "google-genai>=1.0",
]

[project.optional-dependencies]
adk = ["google-adk>=2.7,<3"]  # 2.x graph Workflow runtime (verified 2.7.1)
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]
web = [
    "dj-database-url>=3.1.2",
    "django>=5.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suite"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["web", "suite"]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
]
