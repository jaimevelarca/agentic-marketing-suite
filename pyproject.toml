[project]
name = "agentic-marketing-suite"
version = "0.2.0"
description = "Agentic Marketing Suite — QHHE's 6-layer / 19-agent marketing engine"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "anthropic[vertex]>=0.96",
    "google-cloud-firestore>=2.27",
    "google-cloud-pubsub>=2.23",
    "pydantic>=2.8",
    "jsonschema>=4.23",
    "google-genai>=1.0",
]

[project.optional-dependencies]
adk = ["google-adk>=0.1"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suite"]

[tool.ruff]
line-length = 120
target-version = "py312"
